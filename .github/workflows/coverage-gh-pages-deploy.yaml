# .github/workflows/flutter-coverage.yml
name: Flutter Tests + Coverage

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter/Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov python3-pip

      - name: Remove generated files from coverage
        run: |
          lcov --remove coverage/lcov.info \
            'lib/**/*.g.dart' \
            'lib/**/*.freezed.dart' \
            'lib/**/*.gr.dart' \
            'lib/generated/**' \
            -o coverage/lcov.info

      - name: Generate HTML coverage report
        run: genhtml coverage/lcov.info -o coverage/html

      - name: Extract coverage percentage
        id: coverage
        run: |
          SUMMARY=$(lcov --summary coverage/lcov.info)
          echo "$SUMMARY"
          PERCENT=$(echo "$SUMMARY" | grep "lines" | sed -E 's/.*: ([0-9]+(\.[0-9]+)?)%.*/\1/')
          echo "percentage=$PERCENT" >> $GITHUB_OUTPUT

      - name: Generate SVG badge
        env:
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.percentage }}
        run: |
          python3 -m pip install anybadge
          mkdir -p coverage/badges
          python3 <<'PY'
          import os
          import anybadge

          coverage = float(os.environ["COVERAGE_PERCENT"])

          badge = anybadge.Badge(
              "coverage",
              coverage,
              thresholds={50: "red", 70: "orange", 85: "yellow", 95: "green"},
              value_suffix="%"
          )

          badge.write_badge("coverage/badges/coverage.svg", overwrite=True)
          print(f"Generated badge for {coverage}% coverage")
          PY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: |
            coverage/lcov.info
            coverage/html
            coverage/badges/coverage.svg

      - name: Save badge into repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          mkdir -p .github/badges
          cp coverage/badges/coverage.svg .github/badges/coverage.svg

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/badges/coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push
